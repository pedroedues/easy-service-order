<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talão OS — Ordem de Serviço</title>
  <meta name="theme-color" content="#E8A33D">
  <meta name="description" content="Gere Ordens de Serviço em PDF direto do navegador, sem instalar nada.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <div class="app-header__brand" id="app-header-brand"></div>
      <div class="app-header__actions">
        <span class="badge mono" id="app-header-os">OS-0000-0000</span>
        <button type="button" class="btn btn--ghost" data-action="abrir-config">⚙ Config</button>
      </div>
    </header>

    <main class="app-main">
      <section class="form-panel">
        <div class="form-section card">
          <h2 class="section-title">① Cliente</h2>
          <div id="form-cliente"></div>
        </div>

        <div class="form-section card">
          <h2 class="section-title">② Veículo (opcional)</h2>
          <div id="form-veiculo"></div>
        </div>

        <div class="form-section card">
          <h2 class="section-title">③ Serviços</h2>
          <div id="itens-servicos"></div>
        </div>

        <div class="form-section card">
          <h2 class="section-title">④ Peças (opcional)</h2>
          <div id="itens-pecas"></div>
        </div>

        <div class="total-bar">
          <span>Total geral</span>
          <span id="total-geral">R$ 0,00</span>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn--ghost" data-action="nova-os">Nova OS</button>
          <button type="button" class="btn btn--ghost" data-action="imprimir">Imprimir</button>
          <button type="button" class="btn btn--primary" data-action="gerar-pdf">Gerar PDF</button>
          <a href="#" id="whatsapp-link" class="btn btn--whatsapp" target="_blank" rel="noopener" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.03 2 11c0 2.42 1.09 4.61 2.88 6.23L4 22l5.11-1.35C10.1 20.87 11.03 21 12 21c5.52 0 10-4.03 10-9S17.52 2 12 2Z"/></svg>
            <span>Enviar orçamento por WhatsApp</span>
          </a>
        </div>

        <div class="form-section card historico-section" id="historico-section">
          <div class="historico-header" data-dblclick-action="toggle-historico">
            <h2 class="section-title">OS geradas nesta sessão</h2>
            <button type="button" class="historico-header__chevron" data-action="toggle-historico" aria-label="Mostrar ou ocultar histórico">▾</button>
          </div>
          <div id="historico-root" class="historico-collapsible"></div>
        </div>
      </section>

      <aside class="preview-panel" id="preview-panel">
        <button type="button" class="preview-panel__back" data-action="toggle-preview">← Voltar</button>
        <h2 class="section-title">Via do cliente</h2>
        <div id="preview-root"></div>
      </aside>
    </main>

    <button type="button" class="btn preview-toggle" data-action="toggle-preview">Ver prévia</button>
  </div>

  <div id="modal-root"></div>
  <div class="toast-root" id="toast-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
